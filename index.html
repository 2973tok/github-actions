<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GitHub Actions Deploy Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background-color: #161b22;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }
        h1 {
            color: #58a6ff;
        }
        .info {
            margin-top: 20px;
            font-size: 14px;
            color: #8b949e;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Deployed via GitHub Actions</h1>
        <p class="info">Last deployed: {{DEPLOY_TIME}}</p>
        <p class="info">Commit: {{COMMIT_SHA}}</p>
    </div>
</body>
</html>
